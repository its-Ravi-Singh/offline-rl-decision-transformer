<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decision Transformer API Dashboard</title>
    <meta name="description" content="Dashboard for testing the offline RL Decision Transformer Hopper policy.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-grad-1: #0f172a;
            --bg-grad-2: #1e1b4b;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --success: #10b981;
            --error: #ef4444;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--bg-grad-1), var(--bg-grad-2));
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .glass-panel {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 30px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-panel:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.2);
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: var(--text-muted);
            box-shadow: 0 0 10px var(--text-muted);
        }

        .status-dot.online {
            background-color: var(--success);
            box-shadow: 0 0 10px var(--success);
        }

        .status-dot.offline {
            background-color: var(--error);
            box-shadow: 0 0 10px var(--error);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        .state-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="number"], input[type="text"] {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 10px;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s ease;
        }

        input[type="number"]:focus, input[type="text"]:focus {
            border-color: var(--accent);
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
            font-family: 'Inter', sans-serif;
        }

        button:hover {
            background: var(--accent-hover);
            transform: scale(1.02);
        }

        button:active {
            transform: scale(0.98);
        }

        button.secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
        }

        button.secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        pre {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 15px;
            overflow-x: auto;
            font-size: 0.9rem;
            color: #a78bfa;
            white-space: pre-wrap;
        }
        
        .loader {
            display: none;
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .flex-center {
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Decision Transformer API</h1>
            <p class="subtitle">Interactive Dashboard for Hopper-v4 Policy Evaluation</p>
        </header>

        <div class="glass-panel">
            <h2>
                <div id="status-dot" class="status-dot"></div>
                System Status
            </h2>
            <div id="health-info">
                <p style="color: var(--text-muted);">Checking server health...</p>
            </div>
        </div>

        <div class="glass-panel">
            <h2>Inference Request (/act)</h2>
            
            <div class="form-group">
                <label>Target Return-to-Go (target_rtg)</label>
                <input type="number" id="target-rtg" value="1.0" step="0.1">
            </div>

            <label>State Vector (11 dimensions for Hopper-v4)</label>
            <div class="state-grid" id="state-grid">
                <!-- Inputs generated by JS -->
            </div>

            <div class="btn-group">
                <button id="randomize-btn" class="secondary">Randomize State</button>
                <div class="flex-center">
                    <button id="act-btn">Get Action</button>
                    <div id="loader" class="loader"></div>
                </div>
            </div>
        </div>

        <div class="glass-panel" id="response-panel" style="display: none;">
            <h2>API Response</h2>
            <pre id="response-output"></pre>
        </div>
    </div>

    <script>
        const STATE_DIM = 11;
        const stateGrid = document.getElementById('state-grid');
        const stateInputs = [];

        // Initialize state inputs
        for (let i = 0; i < STATE_DIM; i++) {
            const input = document.createElement('input');
            input.type = 'number';
            input.step = '0.01';
            input.value = '0.00';
            input.id = `state-${i}`;
            stateGrid.appendChild(input);
            stateInputs.push(input);
        }

        // Randomize state
        document.getElementById('randomize-btn').addEventListener('click', () => {
            stateInputs.forEach(input => {
                // Generate random values between -2 and 2
                input.value = ((Math.random() * 4) - 2).toFixed(4);
            });
        });

        // Check Health
        async function checkHealth() {
            const statusDot = document.getElementById('status-dot');
            const healthInfo = document.getElementById('health-info');
            try {
                const res = await fetch('/health');
                const data = await res.json();
                statusDot.className = 'status-dot online';
                healthInfo.innerHTML = `
                    <p><strong>Status:</strong> <span style="color: var(--success)">${data.status}</span></p>
                    <p><strong>Device:</strong> ${data.device}</p>
                    <p><strong>Checkpoint:</strong> ${data.checkpoint.split('/').pop()}</p>
                `;
            } catch (err) {
                statusDot.className = 'status-dot offline';
                healthInfo.innerHTML = `<p style="color: var(--error)">Server offline or unreachable. Please start the uvicorn server.</p>`;
            }
        }

        // Get Action
        document.getElementById('act-btn').addEventListener('click', async () => {
            const loader = document.getElementById('loader');
            const responsePanel = document.getElementById('response-panel');
            const responseOutput = document.getElementById('response-output');
            
            const targetRtg = parseFloat(document.getElementById('target-rtg').value);
            const state = stateInputs.map(input => parseFloat(input.value) || 0.0);

            loader.style.display = 'block';
            
            try {
                const res = await fetch('/act', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        state: state,
                        target_rtg: targetRtg
                    })
                });
                
                const data = await res.json();
                responsePanel.style.display = 'block';
                responseOutput.textContent = JSON.stringify(data, null, 2);
                
                // Add success highlight effect
                responsePanel.style.borderColor = 'var(--success)';
                setTimeout(() => {
                    responsePanel.style.borderColor = 'var(--glass-border)';
                }, 500);

            } catch (err) {
                responsePanel.style.display = 'block';
                responseOutput.textContent = `Error: ${err.message}`;
                responsePanel.style.borderColor = 'var(--error)';
            } finally {
                loader.style.display = 'none';
            }
        });

        // Initial health check
        checkHealth();
    </script>
</body>
</html>
